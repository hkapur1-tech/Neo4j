<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" width="1060" height="540" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1060" height="540" fill="#ffffff"/>

  <text x="30" y="34" font-size="15" font-weight="700" fill="#111827">DKA cohort schema — 7 node labels, 6 relationship types</text>
  <text x="30" y="52" font-size="11.5" fill="#6b7280">96 patients · 1,979 admissions (552 DKA) · 51,013 nodes · 126,396 relationships</text>

  <!-- ===== edges ===== -->
  <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arw)">
    <line x1="152"   y1="90"    x2="338"   y2="90"/>
    <line x1="348.6" y1="117.9" x2="139.9" y2="303.4"/>
    <line x1="366.7" y1="129.8" x2="312.6" y2="292.1"/>
    <line x1="397.5" y1="128.2" x2="473.3" y2="293.6"/>
    <line x1="412.8" y1="116.2" x2="648.8" y2="305.0"/>
    <line x1="417.9" y1="108.2" x2="843.9" y2="312.7"/>
  </g>

  <!-- ===== edge labels ===== -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <g>
      <rect x="191" y="78" width="108" height="24" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="245" y="94" fill="#374151">HAS_ADMISSION</text>
    </g>
    <g>
      <rect x="146" y="236" width="112" height="24" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="202" y="252" fill="#374151">HAS_LAB_EVENT</text>
    </g>
    <g>
      <rect x="293" y="183" width="104" height="24" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="345" y="199" fill="#374151">HAS_ICU_STAY</text>
    </g>
    <g>
      <rect x="399" y="238" width="112" height="36" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="455" y="252" fill="#374151">HAS_DIAGNOSIS</text>
      <text x="455" y="266" font-size="9" font-weight="400" fill="#6b7280">seq_num</text>
    </g>
    <g>
      <rect x="522" y="234" width="112" height="36" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="578" y="248" fill="#374151">HAS_PROCEDURE</text>
      <text x="578" y="262" font-size="9" font-weight="400" fill="#6b7280">seq_num · chartdate</text>
    </g>
    <g>
      <rect x="489" y="164" width="156" height="36" rx="5" fill="#ffffff" stroke="#d1d5db"/>
      <text x="567" y="178" fill="#374151">PRESCRIBED</text>
      <text x="567" y="192" font-size="9" font-weight="400" fill="#6b7280">starttime · route · n_orders</text>
    </g>
  </g>

  <!-- ===== nodes ===== -->
  <g text-anchor="middle">
    <!-- Patient -->
    <circle cx="110" cy="90" r="42" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="110" y="95" font-size="12.5" font-weight="700" fill="#1f2937">Patient</text>
    <g font-size="11" fill="#4b5563">
      <text x="110" y="152">subject_id : int</text>
      <text x="110" y="167">gender : str</text>
      <text x="110" y="182">anchor_age : int</text>
    </g>

    <!-- Admission (hub) -->
    <circle cx="380" cy="90" r="42" fill="#cffafe" stroke="#0e7490" stroke-width="3"/>
    <text x="380" y="88" font-size="12" font-weight="700" fill="#1f2937">Admis-</text>
    <text x="380" y="101" font-size="12" font-weight="700" fill="#1f2937">sion</text>
    <g font-size="11" fill="#4b5563" text-anchor="start">
      <text x="452" y="48">hadm_id : int</text>
      <text x="452" y="63">admittime : datetime</text>
      <text x="452" y="78">dischtime : datetime</text>
      <text x="452" y="93" font-weight="700" fill="#0e7490">is_dka : bool</text>
      <text x="452" y="108" fill="#9ca3af">+ 3 more</text>
    </g>

    <!-- LabEvent -->
    <circle cx="110" cy="330" r="40" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="110" y="328" font-size="11.5" font-weight="700" fill="#1f2937">Lab-</text>
    <text x="110" y="341" font-size="11.5" font-weight="700" fill="#1f2937">Event</text>
    <g font-size="11" fill="#4b5563">
      <text x="110" y="392">label : str</text>
      <text x="110" y="407" font-weight="700" fill="#b45309">fluid : str</text>
      <text x="110" y="422">valuenum : float</text>
      <text x="110" y="437">charttime : datetime</text>
      <text x="110" y="452" fill="#9ca3af">+ 4 more</text>
    </g>

    <!-- ICUStay -->
    <circle cx="300" cy="330" r="40" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
    <text x="300" y="328" font-size="11.5" font-weight="700" fill="#1f2937">ICU-</text>
    <text x="300" y="341" font-size="11.5" font-weight="700" fill="#1f2937">Stay</text>
    <g font-size="11" fill="#4b5563">
      <text x="300" y="392">stay_id : int</text>
      <text x="300" y="407">first_careunit : str</text>
      <text x="300" y="422">los : float</text>
      <text x="300" y="437" fill="#9ca3af">+ 2 more</text>
    </g>

    <!-- Diagnosis -->
    <circle cx="490" cy="330" r="40" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="490" y="328" font-size="11.5" font-weight="700" fill="#1f2937">Diag-</text>
    <text x="490" y="341" font-size="11.5" font-weight="700" fill="#1f2937">nosis</text>
    <g font-size="11" fill="#4b5563">
      <text x="490" y="392">code : str</text>
      <text x="490" y="407">icd_code : str</text>
      <text x="490" y="422">long_title : str</text>
      <text x="490" y="437" fill="#9ca3af">+ 1 more</text>
    </g>

    <!-- Procedure -->
    <circle cx="680" cy="330" r="40" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="680" y="328" font-size="11.5" font-weight="700" fill="#1f2937">Proce-</text>
    <text x="680" y="341" font-size="11.5" font-weight="700" fill="#1f2937">dure</text>
    <g font-size="11" fill="#4b5563">
      <text x="680" y="392">code : str</text>
      <text x="680" y="407">icd_code : str</text>
      <text x="680" y="422">long_title : str</text>
      <text x="680" y="437" fill="#9ca3af">+ 1 more</text>
    </g>

    <!-- Medication -->
    <circle cx="880" cy="330" r="40" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="880" y="328" font-size="11.5" font-weight="700" fill="#1f2937">Medi-</text>
    <text x="880" y="341" font-size="11.5" font-weight="700" fill="#1f2937">cation</text>
    <g font-size="11" fill="#4b5563">
      <text x="880" y="392">drug : str</text>
    </g>
  </g>

  <!-- ===== notes ===== -->
  <g font-size="10.5" fill="#6b7280">
    <text x="30" y="500" font-weight="700" fill="#374151">What the diagram cannot say, and the prompt must:</text>
    <text x="30" y="517">LabEvents exist only for DKA admissions (34 of 552 have none) · seq_num = 1 is the principal diagnosis · label is ambiguous without fluid</text>
  </g>
</svg>
